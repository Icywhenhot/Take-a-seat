pluginManagement {
	repositories {
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Allows Gradle to automatically download a JDK 21 toolchain if one is not installed locally.
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Should match your mod's display name
rootProject.name = 'take-a-seat'
