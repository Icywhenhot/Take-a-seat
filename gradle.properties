# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.10
loader_version=0.19.3
loom_version=1.13.6

# Mod Properties
mod_version=1.0.0
maven_group=com.takeaseat
archives_base_name=takeaseat

# Dependencies
fabric_api_version=0.138.4+1.21.10
# Player Animation Library (ZigyTheBird) - replaces kosmx player-animator.
# No dedicated 1.21.10 build exists; the 1.21.9 build is binary-compatible (same intermediary) and is the one published for 1.21.10.
pal_version=1.1.3+mc.1.21.9
# Mod Menu (optional - in-game config screen). 16.0.1 targets MC 1.21.10.
modmenu_version=16.0.1
# Cloth Config (config screen GUI). 20.0.149 targets MC 1.21.10.
cloth_version=20.0.149
