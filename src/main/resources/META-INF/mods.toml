description='''Sit, lounge, and relax. Press a key and Take a Seat plays a context-aware sitting animation on your player - it figures out what you're near or holding and picks a fitting pose, then keeps your model in frame with a smooth camera. Other players see you sitting too when they also have the mod.'''
