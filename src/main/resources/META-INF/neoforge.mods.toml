modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
showAsResourcePack=false
showAsDataPack=false

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''Sit, lounge, and relax. Press a key and Take a Seat plays a context-aware sitting animation on your player - it figures out what you're near or holding and picks a fitting pose, then keeps your model in frame with a smooth camera. Other players see you sitting too when they also have the mod.'''
authors="Take a Seat"
logoFile="assets/takeaseat/icon.png"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.235,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="player_animation_library"
type="required"
versionRange="[${pal_version},)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="takeaseat.client.mixins.json"
