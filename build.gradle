// NOTE: Loom is applied via the legacy buildscript classpath (not the plugins {} DSL) so we can pin an
// exact 1.13.x release. Loom 1.14.x mis-detects the last obfuscated release (1.21.11) as "unobfuscated"
// because it uses a release-time-only cutoff; 1.13.x predates that and builds obfuscated 1.21.11 correctly.
buildscript {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
	dependencies {
		classpath "net.fabricmc:fabric-loom:${loom_version}"
	}
}

plugins {
	id 'maven-publish'
}

apply plugin: 'fabric-loom'

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Player Animation Library (ZigyTheBird) maven
	maven {
		name = "RedlanceMinecraft"
		url = "https://repo.redlance.org/public"
	}
	// Mod Menu maven
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	// Cloth Config maven
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"takeaseat" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Official Mojang mappings (the source is written against Mojang names).
	mappings loom.officialMojangMappings()

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Player Animation Library (ZigyTheBird) - the animation backend.
	// 1.21.11 is obfuscated, so mod deps use `modImplementation` (Loom remaps them).
	modImplementation "com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.pal_version}"

	// Mod Menu - OPTIONAL. Only used to expose the in-game config screen.
	// Present at compile + dev runtime; not required for end users (entrypoint only loads if installed).
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Cloth Config - builds the config screen. Bundled (include) so users don't need a separate install.
	modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
	include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
