plugins {
	id 'net.minecraftforge.gradle' version '6.0.54'
	id 'org.spongepowered.mixin' version '0.7.38'
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

tasks.withType(AbstractArchiveTask).configureEach {
	archiveVersion = "${project.mod_version}-${project.minecraft_version}-forge"
}

repositories {
	mavenCentral()
	maven {
		name = "Forge"
		url = "https://maven.minecraftforge.net/"
	}
	maven {
		name = "Minecraft Libraries"
		url = "https://libraries.minecraft.net/"
	}
	maven {
		name = "KosmX"
		url = "https://maven.kosmx.dev/"
	}
	maven {
		name = "Shedaniel"
		url = "https://maven.shedaniel.me/"
	}
}

minecraft {
	mappings channel: 'official', version: project.minecraft_version
	copyIdeResources = true

	runs {
		client {
			workingDirectory project.file('run')
			mods {
				"${project.mod_id}" { source sourceSets.main }
			}
		}
		server {
			workingDirectory project.file('run/server')
			args '--nogui'
			mods {
				"${project.mod_id}" { source sourceSets.main }
			}
		}
	}
}

mixin {
	add sourceSets.main, 'takeaseat.refmap.json'
	config 'takeaseat.client.mixins.json'
}

dependencies {
	minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
	implementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${project.playeranim_version}")
	implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${project.cloth_version}")
	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand(
				minecraft_version: project.minecraft_version,
				mod_group_id: project.mod_group_id,
				mod_id: project.mod_id,
				mod_license: project.mod_license,
				mod_name: project.mod_name,
				mod_version: project.mod_version,
				forge_version: project.forge_version,
				playeranim_version: project.playeranim_version,
				cloth_version: project.cloth_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(17)
}

jar {
	manifest.attributes 'MixinConfigs': 'takeaseat.client.mixins.json'
	finalizedBy 'reobfJar'
	inputs.property "projectName", project.mod_id

	from("LICENSE") {
		rename { "${it}_${project.mod_id}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
