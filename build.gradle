plugins {
	id 'net.neoforged.moddev' version '2.0.141'
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

repositories {
	mavenCentral()
	maven {
		name = "NeoForged"
		url = "https://maven.neoforged.net/releases/"
	}
	maven {
		name = "Minecraft Libraries"
		url = "https://libraries.minecraft.net/"
	}
	maven {
		// Player Animation Library (com.zigythebird.playeranim)
		name = "RedlanceMinecraft"
		url = "https://repo.redlance.org/public"
	}
}

neoForge {
	version = project.neo_version

	runs {
		client {
			client()
			systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
		}
		server {
			server()
			systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	implementation "net.neoforged:neoforge:${project.neo_version}"

	// Player Animation Library backend (NeoForge build for MC 1.21.1).
	//
	// This is NOT jar-in-jar'd. PAL's NeoForge distribution jar bundles PlayerAnimationLibCore's
	// classes directly into its own module (it isn't packaged as a nested jar-in-jar artifact), so
	// jarJar-ing our own copy of PlayerAnimationLibCore alongside a standalone PAL install causes a
	// JPMS split-package ResolutionException at startup: two separate modules both export
	// com.zigythebird.playeranimcore.loading, and NeoForge's jar-in-jar version negotiation has no
	// way to recognize the standalone jar as satisfying the embedded one. Requiring PAL as a normal
	// mod dependency (see neoforge.mods.toml) avoids that class of conflict entirely.
	//
	// On the compile/runtime classpath we only need the Neo artifact; it transitively pulls
	// Core, mochafloats and javassist. We exclude the libraries Minecraft already ships so they
	// don't conflict at compile time.
	implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${project.pal_version}") {
		exclude group: "com.google.code.gson"
		exclude group: "org.slf4j"
		exclude group: "it.unimi.dsi", module: "fastutil"
		exclude group: "io.netty"
		exclude group: "org.joml"
		exclude group: "org.jetbrains", module: "annotations"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand(
				minecraft_version: project.minecraft_version,
				mod_group_id: project.mod_group_id,
				mod_id: project.mod_id,
				mod_license: project.mod_license,
				mod_name: project.mod_name,
				mod_version: project.mod_version,
				neo_version: project.neo_version,
				pal_version: project.pal_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	// Minecraft 1.21.11 runs on Java 21.
	toolchain.languageVersion = JavaLanguageVersion.of(21)
}

jar {
	inputs.property "projectName", project.mod_id

	from("LICENSE") {
		rename { "${it}_${project.mod_id}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
